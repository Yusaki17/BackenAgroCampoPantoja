# Nombre de la aplicación
spring.application.name=AgroSierra

# Puerto del servidor
server.port=8080

# ===== H2 (base de datos en memoria) =====
spring.datasource.url=jdbc:h2:mem:agrosierra;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== H2 Console (para ver la base en el navegador) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== JWT =====
app.jwt.secret=claveSecretaMuyLargaParaFirmarElTokenJWT2026AgroSierraCooperativa
app.jwt.expiracion-minutos=60

# ===== Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html